[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "durable-research-agent-harness"
version = "0.1.0"
description = "A from-scratch, durable tool-calling research agent harness."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "openai>=1.0,<3",
  "pydantic>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.8,<1",
]

[project.scripts]
research-agent = "research_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
